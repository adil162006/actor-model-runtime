apiVersion: v1
kind: ConfigMap
metadata:
  name: actorlab-config
  namespace: actorlab
data:
  PORT: '3000'
  WORKER_PORT: '3101'
  COORDINATOR_URL: 'http://actorlab-api:3000'
  RUNTIME_MODE: 'kubernetes'
  HEARTBEAT_INTERVAL_MS: '4000'
  WORKER_TIMEOUT_MS: '15000'
  ACTOR_IDLE_TIMEOUT_MS: '60000'
  ACTOR_DEACTIVATION_INTERVAL_MS: '10000'
  MESSAGE_RECOVERY_INTERVAL_MS: '1000'
  AUTO_REBALANCE_INTERVAL_MS: '30000'
  WORKER_REQUEST_TIMEOUT_MS: '5000'
  SINGLETON_LEASE_MS: '12000'
  K8S_NAMESPACE: 'actorlab'
  WORKER_DEPLOYMENT: 'actor-worker'
  K8S_REQUEST_TIMEOUT_MS: '15000'
