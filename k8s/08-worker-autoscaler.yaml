apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: actor-worker-autoscaler
  namespace: actorlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: actor-worker
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
