apiVersion: v1
kind: ServiceAccount
metadata:
  name: actorlab-api
  namespace: actorlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actorlab-api
  namespace: actorlab
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['actor-worker']
    verbs: ['get', 'patch']
  - apiGroups: ['metrics.k8s.io']
    resources: ['pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actorlab-api
  namespace: actorlab
subjects:
  - kind: ServiceAccount
    name: actorlab-api
    namespace: actorlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actorlab-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actorlab-api-node-reader
rules:
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actorlab-api-node-reader
subjects:
  - kind: ServiceAccount
    name: actorlab-api
    namespace: actorlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actorlab-api-node-reader
